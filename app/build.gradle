plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.lifeschess'
    compileSdk 35
    ndkVersion '25.2.9519653'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    defaultConfig {
        applicationId 'ru.lifeschess'
        minSdk 19
        targetSdk 34
        versionCode 3
        versionName '0.2 beta'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('signing/signing.properties')
            def envStorePassword = System.getenv('LIFECHESS_RELEASE_STORE_PASSWORD')
            def envKeyPassword = System.getenv('LIFECHESS_RELEASE_KEY_PASSWORD')
            def hasEnvironmentSigning = envStorePassword && envKeyPassword
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file("signing/${props['storeFile']}")
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else if (hasEnvironmentSigning) {
                storeFile rootProject.file(System.getenv('LIFECHESS_RELEASE_KEYSTORE')
                        ?: 'signing/lifeschess-release.jks')
                storePassword envStorePassword
                keyAlias System.getenv('LIFECHESS_RELEASE_KEY_ALIAS') ?: 'lifeschess'
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // A clean checkout must remain buildable without exposing a private key.
            // Signing can be configured by an ignored properties file or environment variables.
            def hasEnvironmentSigning = System.getenv('LIFECHESS_RELEASE_STORE_PASSWORD')
                    && System.getenv('LIFECHESS_RELEASE_KEY_PASSWORD')
            if (rootProject.file('signing/signing.properties').exists() || hasEnvironmentSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('copyLifeChessApk') {
    dependsOn 'assembleRelease'
    def releaseApkDir = layout.buildDirectory.dir('outputs/apk/release')
    def distributableApk = rootProject.file('LifeChess.apk')
    inputs.dir(releaseApkDir)
    outputs.file(distributableApk)
    doLast {
        def releaseDirectory = releaseApkDir.get().asFile
        def signedReleaseApk = new File(releaseDirectory, 'app-release.apk')
        def unsignedReleaseApk = new File(releaseDirectory, 'app-release-unsigned.apk')
        def selectedReleaseApk = signedReleaseApk.isFile() ? signedReleaseApk : unsignedReleaseApk
        if (!selectedReleaseApk.isFile()) {
            throw new GradleException('No release APK was produced')
        }
        java.nio.file.Files.copy(selectedReleaseApk.toPath(), distributableApk.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
